function u8(b){var s=atob(b),a=new Uint8Array(s.length);for(var i=0;i<s.length;i++)a[i]=s.charCodeAt(i);return a}
async function unlock(pw){
  var k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  var key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:u8(P.s),iterations:P.n,hash:'SHA-256'},k,{name:'AES-GCM',length:256},false,['decrypt']);
  var pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:u8(P.i)},key,u8(P.d));
  return new TextDecoder().decode(pt);
}
function show(h){document.open();document.write(h);document.close()}
document.getElementById('f').addEventListener('submit',async function(ev){
  ev.preventDefault();var b=document.getElementById('b'),e=document.getElementById('e'),pw=document.getElementById('p').value;
  b.disabled=true;e.textContent='';
  try{if(!crypto||!crypto.subtle)throw 0;var h=await unlock(pw);try{sessionStorage.setItem('adm',pw)}catch(x){}show(h)}
  catch(x){e.textContent='Wrong password.';b.disabled=false;document.getElementById('p').select()}
});
