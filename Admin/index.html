async function unlock(pw){

  var key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:u8(P.s),iterations:P.n,hash:'SHA-256'},k,{name:'AES-GCM',length:256},false,['decrypt']);
  var pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:u8(P.i)},key,u8(P.d));
  return new TextDecoder().decode(pt);
}
function show(h){document.open();document.write(h);document.close()}
document.getElementById('sh').addEventListener('change',function(){document.getElementById('p').type=this.checked?'text':'password'});
document.getElementById('f').addEventListener('submit',async function(ev){
  ev.preventDefault();var b=document.getElementById('b'),e=document.getElementById('e'),pw=document.getElementById('p').value.trim();
  b.disabled=true;e.textContent='';
  try{if(!window.crypto||!crypto.subtle)throw new Error('crypto unavailable');var h=await unlock(pw);try{sessionStorage.setItem('adm',pw)}catch(x){}show(h)}
  catch(x){e.textContent=(x&&x.name==='OperationError')?'Wrong password. Check the keyboard language and capital letters.':'This browser cannot unlock the page ('+((x&&x.message)||'secure context needed')+'). Open it in Chrome, Edge or Safari over https.';b.disabled=false;document.getElementById('p').select()}
});
(async function(){try{var s=sessionStorage.getItem('adm');if(s)show(await unlock(s))}catch(x){try{sessionStorage.removeItem('adm')}catch(y){}}})();
