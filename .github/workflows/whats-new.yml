# Keeps the NEW labels on plans.classera.com up to date.
# Runs after every push and every 3 hours (to catch edits made only in the Google Sheet).
name: Update NEW labels
on:
  push:
    branches: [main]
    paths-ignore: ['assets/whats-new.json']
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: whats-new
  cancel-in-progress: false
jobs:
  stamp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Stamp new and changed items
        run: node scripts/whats-new.mjs
      - name: Commit the registry if it changed
        run: |
          if git diff --quiet -- assets/whats-new.json; then echo "No changes"; exit 0; fi
          git config user.name "classera-whats-new[bot]"
          git config user.email "actions@users.noreply.github.com"
          git add assets/whats-new.json
          git commit -m "Update NEW labels registry"
          for i in 1 2 3; do git pull --rebase origin main && git push && exit 0; sleep 5; done
          exit 1
